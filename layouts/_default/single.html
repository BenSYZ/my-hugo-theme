<!DOCTYPE html>
<html>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="container">
      <div class="header"> {{ partial "header.html" . }} </div>
      <div class="middle">
        <!-- left -->
        <div id="TitleWithToc">
        {{ if not .Params.disableTOC }}
          <div id="TitleOfToc">{{ .Title }}</div>
          {{ .TableOfContents }}
        {{ end }}
        </div>
        <!-- middle -->
        <div id="content"> {{ .Content }} </div>
        <!-- right -->
        <div id="Rsidebar"> {{partial "sidebar.html" .}} </div>
      </div>
      <div class="footer">
        {{ partial "taxonomies.html" . }}
        {{ partial "footer.html" . }}
      </div>
    </div>
  </body>
</html>
